<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
    <header>
        <div>
            <h1>💰 Expense Tracker</h1>
            <p>Manage your money smartly</p>
        </div>
        <span class="tag">PERSONAL FINANCE</span>
    </header>

    <section class="summary">
        <div class="card"><p>Total Expenses</p><h2 id="totalExpense">₹0.00</h2></div>
        <div class="card"><p>This Month</p><h2 id="monthlyExpense">₹0.00</h2></div>
        <div class="card"><p>Total Transactions</p><h2 id="totalCount">0</h2></div>
    </section>

    <section class="form-section">
        <h2 id="formTitle">Add New Expense</h2>
        <form id="expenseForm">
            <input type="hidden" id="editId">
            <div class="form-grid">
                <div><label for="expenseName">Expense Name</label><input type="text" id="expenseName" placeholder="e.g. Lunch" required></div>
                <div><label for="amount">Amount (₹)</label><input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required></div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option>Food</option><option>Travel</option><option>Shopping</option>
                        <option>Education</option><option>Health</option>
                        <option>Entertainment</option><option>Other</option>
                    </select>
                </div>
                <div><label for="date">Date</label><input type="date" id="date" required></div>
            </div>
            <button type="submit" id="submitBtn">Add Expense</button>
            <button type="button" id="cancelBtn" class="cancel hidden">Cancel Edit</button>
        </form>
    </section>

    <section class="transactions">
        <div class="section-heading">
            <h2>Recent Transactions</h2>
            <select id="filter" aria-label="Filter by category">
                <option value="All">All Categories</option>
                <option>Food</option><option>Travel</option><option>Shopping</option>
                <option>Education</option><option>Health</option>
                <option>Entertainment</option><option>Other</option>
            </select>
        </div>
        <div class="table-wrap">
            <table>
                <thead><tr><th>Name</th><th>Category</th><th>Date</th><th>Amount</th><th>Actions</th></tr></thead>
                <tbody id="expenseList"></tbody>
            </table>
        </div>
        <p id="emptyMessage">No expenses added yet.</p>
    </section>

    <section class="chart-section">
        <h2>Category-wise Expenses</h2>
        <div class="chart-container"><canvas id="expenseChart"></canvas></div>
    </section>

    <footer><p>Personal Expense Tracker | College Project</p></footer>
</div>
<script src="script.js"></script>
</body>
</html>
